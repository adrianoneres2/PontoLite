<!DOCTYPE html>
<html th:replace="~{aplicacao :: layout(~{:: main})}">

<main>
	<div class="card">
		<div class="card-header d-flex justify-content-between align-items-center">
			<h5 class="mb-0"><i class="bi bi-building-gear"></i> Alteração de Cliente</h5>
		</div>
		<div class="card-body">
			<form action="#" th:action="@{/pontolite/cliente/alterar}" th:object="${cliente}" method="post"
				th:onsubmit="submitFormViaFetch(this, event);">
				<input type="hidden" th:field="*{codigoCliente}">

				<!-- Section: Company Data -->
				<h6 class="text-muted mb-3 text-uppercase font-weight-bold"
					style="font-size: 0.8rem; letter-spacing: 1px;">Dados da Empresa</h6>
				<div class="row">
					<div class="col-md-6 mb-3">
						<label for="input-razao-social" class="form-label">Razão Social</label>
						<input type="text" class="form-control" id="input-razao-social" placeholder="Razão Social"
							required th:field="*{razaoSocial}" maxlength="60">
						<div class="text-danger small mt-1" th:if="${#fields.hasErrors('razaoSocial')}"
							th:errors="*{razaoSocial}"></div>
					</div>
					<div class="col-md-6 mb-3">
						<label for="input-nome-fantasia" class="form-label">Nome Fantasia</label>
						<input type="text" class="form-control" id="input-nome-fantasia" placeholder="Nome Fantasia"
							value="" required th:field="*{nomeCliente}" maxlength="60">
						<div class="text-danger small mt-1" th:if="${#fields.hasErrors('nomeCliente')}"
							th:errors="*{nomeCliente}"></div>
					</div>
					<div class="col-md-6 mb-3">
						<label for="input-cnpj" class="form-label">CNPJ</label>
						<input type="text" class="form-control" id="input-cnpj" placeholder="CNPJ" value="" required
							th:field="*{numeroCnpj}" maxlength="18" onkeypress="mascara_cnpj(this)"
							onblur="validar_cnpj(this.value)">
						<div class="text-danger small mt-1" th:if="${#fields.hasErrors('numeroCnpj')}"
							th:errors="*{numeroCnpj}"></div>
					</div>
				</div>

				<hr class="my-4">

				<!-- Section: Contact -->
				<h6 class="text-muted mb-3 text-uppercase font-weight-bold"
					style="font-size: 0.8rem; letter-spacing: 1px;">Contato</h6>
				<div class="row">
					<div class="col-md-6 mb-3">
						<label for="input-telefone" class="form-label">Telefone</label>
						<input type="text" class="form-control" id="input-telefone" placeholder="Telefone" value=""
							required th:field="*{numeroTelefone}" maxlength="15"
							onkeydown="mascaraTelefonefone(event,'input-telefone')"
							onblur="limpaTelefone('input-telefone')">
						<div class="text-danger small mt-1" th:if="${#fields.hasErrors('numeroTelefone')}"
							th:errors="*{numeroTelefone}"></div>
					</div>
					<div class="col-md-6 mb-3">
						<label for="input-email" class="form-label">E-mail</label>
						<input type="email" class="form-control" id="input-email" placeholder="E-mail" required
							th:field="*{nomeEmail}" maxlength="80">
						<div class="text-danger small mt-1" th:if="${#fields.hasErrors('nomeEmail')}"
							th:errors="*{nomeEmail}"></div>
					</div>
				</div>

				<hr class="my-4">

				<!-- Actions -->
				<div class="d-flex justify-content-end gap-2">
					<button class="btn btn-primary" type="submit" id="bt-enviar"><i class="bi bi-save"></i> Salvar
						Alterações</button>
				</div>
			</form>
		</div>
	</div>
</main>

</html>
