<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<!-- Pass 'login' specific CSS or just base head -->
<div th:replace="~{base :: head}"></div>

<body class="login-body">
	<div class="login-card">
		<!-- Left Side: Brand / Image -->
		<div class="login-sidebar">
			<div class="login-sidebar-content">
				<h1 style="font-size: 3rem; margin-bottom: 20px; color: rgb(255, 255, 255);">Ponto Lite!</h1>
				<p style="font-size: 1.2rem; opacity: 0.9;">Gestão Inteligente de Ponto e Jornada</p>
			</div>
		</div>

		<!-- Right Side: Form -->
		<div class="login-form-container">
			<div class="d-flex flex-column align-items-center mb-4">
				<span class="login-brand">Bem-vindo</span>
				<span class="login-subtitle">Faça login para acessar sua conta</span>
			</div>

			<form method="post" th:action="@{/login}" th:object="${loginDTO}">
				<div class="form-group mb-3">
					<label for="username" class="form-label text-muted">Usuário</label>
					<div class="input-group">
						<span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
						<input th:field="*{username}" type="text" class="form-control border-start-0 ps-0" id="username"
							placeholder="Digite seu usuário" required>
					</div>
				</div>

				<div class="form-group mb-4">
					<label for="password" class="form-label text-muted">Senha</label>
					<div class="input-group">
						<span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
						<input th:field="*{password}" type="password" class="form-control border-start-0 ps-0"
							id="password" placeholder="Digite sua senha" required>
					</div>
				</div>

				<button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
					Acessar Sistema
				</button>

				<div class="text-center">
					<a href="#" class="text-muted small">Esqueceu sua senha?</a>
				</div>

				<div class="alert alert-danger mt-4" role="alert" th:if="${param.error}">
					<i class="bi bi-exclamation-circle me-2"></i> Usuário ou senha inválidos.
				</div>
			</form>
		</div>
	</div>

	<div th:replace="~{base :: mensagem-aplicacao}"></div>
	<div th:replace="~{base :: script}"></div>
</body>

</html>
