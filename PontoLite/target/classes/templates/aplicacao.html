<!DOCTYPE html>
<html th:fragment="layout(conteudo)" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{base :: head}"></head>

<body>
	<div class="layout-wrapper">
		<!-- Sidebar from Base Fragment -->
		<div th:replace="~{base :: menu-principal}"></div>

		<!-- Main Content Area -->
		<div class="main-content">
			<!-- Header / Topbar (Simplified) -->
			<div class="page-header d-flex justify-content-between align-items-center">
				<div>
					<h1 th:text="'Bem-vindo, ' + ${session.usuarioLogado.username}"
						style="font-size: 20px; font-weight: normal; color: #666;">Bem-vindo</h1>
					<small class="text-muted" th:text="${session.usuarioLogado.perfil.nomePerfil}"></small>
				</div>
				<div class="d-flex align-items-center gap-2">
					<a href="#" onclick="loadContentViaFetch('/pontolite', event)"
						class="btn btn-primary btn-sm rounded-pill fw-semibold shadow-sm" style="width: 100px;"><i
							class="bi bi-house-door-fill me-1"></i>
						Home</a>
					<div style="width: 10px;"></div>
					<a th:href="@{/login/logof}" class="btn btn-danger btn-sm rounded-pill fw-semibold shadow-sm"
						style="width: 100px;"><i class="bi bi-power me-1"></i> Sair</a>
				</div>
			</div>

			<!-- Dynamic Content Injection -->
			<div style="margin-top: 20px;">
				<main th:replace="${conteudo}"></main>
			</div>

			<message>
				<!-- Floating Messages -->
				<div id="floating-messages" th:replace="~{base :: mensagem-aplicacao}"></div>
				<!-- Validation Messages -->
				<div id="validation-message"></div>
			</message>
		</div>
	</div>

	<!-- Scripts Fragment -->
	<div th:replace="~{base :: script}"></div>

</body>

</html>
