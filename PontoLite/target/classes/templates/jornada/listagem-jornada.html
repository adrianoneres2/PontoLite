<!DOCTYPE html>
<html th:replace="~{aplicacao :: layout(~{:: main})}">

<main>
	<div class="card">
		<div class="card-header d-flex justify-content-between align-items-center">
			<span>Listagem de Jornadas</span>
		</div>
		<div class="card-body">
			<!-- Search Bar -->
			<div class="mb-4">
				<div class="input-group">
					<span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
					<input type="text" class="form-control" id="searchInput" placeholder="Buscar por nome..."
						th:value="${nomeJornada}">

					<button class="btn btn-outline-primary btn-sm" title="Pesquisar"
						th:onclick="|pesquisarFormulario('@{/pontolite/jornada/listar-por-nome(nomeJornada=parametro)}', event)|"
						style="margin-left: 18px;">
						<i class="bi bi-search"></i> Pesquisar
					</button>
				</div>
			</div>

			<!-- Table -->
			<div class="table-responsive">
				<table id="clientTable" class="table table-hover align-middle default-table-font-size">
					<thead>
						<tr>
							<th scope="col">#</th>
							<th scope="col">Nome da Jornada</th>
							<th scope="col">Cadastro</th>
							<th scope="col">Cliente</th>
							<th scope="col">Usuário Cadastro</th>
							<th scope="col">Escala</th>
							<th scope="col" class="text-center">Ações</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="jornada : ${jornadas}">
							<th th:text="${jornada.codigoJornada}" scope="row"></th>
							<td th:text="${jornada.nomeJornada}"></td>
							<td th:text="${#dates.format(jornada.dataCriacao, 'dd/MM/yyyy')}"></td>
							<td th:text="${jornada.cliente.nomeCliente}"></td>
							<td th:text="${jornada.usuarioCadastro.username}"></td>
							<td th:text="${jornada.tipoEscala.nomeTipoEscala}"></td>
							<td class="text-center">
								<div class="btn-group" role="group">
									<a href="#" id="id-status"
										th:onclick="|apiAtualizaStatus('@{/pontolite/jornada/alterar-status(codJornada=${jornada.codigoJornada})}', event)|"
										class="btn btn-sm"
										th:classappend="${jornada.situacaoJornada==1} ? 'btn-outline-success' : 'btn-outline-danger'"
										title="Status">
										<i
											th:classappend="${jornada.situacaoJornada==1} ? 'bi bi-check-circle-fill text-success' : 'bi bi-x-circle-fill text-danger'"></i>
									</a>
									<a href="#"
										th:onclick="|pesquisarFormulario('@{/pontolite/jornada/alterar(codJornada=${jornada.codigoJornada})}', event)|"
										class="btn btn-outline-primary btn-sm" title="Editar">
										<i class="bi bi-pencil"></i>
									</a>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>

			<!-- Paginação -->
			<nav th:if="${jornadasPage != null and jornadasPage.totalPages > 1}" aria-label="Navegação de página"
				class="mt-4">
				<ul class="pagination justify-content-center">
					<li class="page-item" th:classappend="${jornadasPage.first} ? 'disabled'">
						<a class="page-link" href="#"
							th:onclick="|pesquisarFormulario('@{/pontolite/jornada/listar-por-nome(nomeJornada=${nomeJornada}, page=${jornadasPage.number - 1})}', event)|"
							tabindex="-1" aria-disabled="true">Anterior</a>
					</li>

					<li class="page-item" th:each="i : ${#numbers.sequence(0, jornadasPage.totalPages - 1)}"
						th:classappend="${jornadasPage.number == i} ? 'active'">
						<a class="page-link" href="#"
							th:onclick="|pesquisarFormulario('@{/pontolite/jornada/listar-por-nome(nomeJornada=${nomeJornada}, page=${i})}', event)|"
							th:text="${i + 1}">1</a>
					</li>

					<li class="page-item" th:classappend="${jornadasPage.last} ? 'disabled'">
						<a class="page-link" href="#"
							th:onclick="|pesquisarFormulario('@{/pontolite/jornada/listar-por-nome(nomeJornada=${nomeJornada}, page=${jornadasPage.number + 1})}', event)|">Próxima</a>
					</li>
				</ul>
			</nav>

			<div class="alert alert-warning mt-3 border-0 bg-warning-light" role="alert" id="noResults"
				style="display: none;">
				<i class="bi bi-info-circle me-2"></i> Nenhuma jornada encontrado.
			</div>
		</div>
	</div>
</main>

</html>
