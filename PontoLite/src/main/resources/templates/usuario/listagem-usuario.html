<!DOCTYPE html>
<html th:replace="~{aplicacao :: layout(~{:: main})}">

<main>
	<!-- Card Wrapper -->
	<div class="card">
		<div class="card-header d-flex justify-content-between align-items-center">
			<h5 class="mb-0">Listagem de Usuários</h5>
		</div>
		<div class="card-body">
			<!-- Search -->
			<div class="mb-4">
				<div class="input-group">
					<span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
					<input type="text" class="form-control" id="searchInput" placeholder="Buscar por nome"
						th:value="${nomeUsuario}">

					<button class="btn btn-outline-primary btn-sm" title="Pesquisar"
						th:onclick="|pesquisarFormulario('@{/pontolite/usuario/listar-por-nome(nomeUsuario=parametro)}', event)|"
						style="margin-left: 18px;">
						<i class="bi bi-search"></i> Pesquisar
					</button>
				</div>
			</div>

			<!-- Table -->
			<div class="table-responsive">
				<table id="clientTable" class="table table-hover align-middle default-table-font-size">
					<thead>
						<tr>
							<th scope="col">#</th>
							<th scope="col">Nome</th>
							<th scope="col">E-mail</th>
							<th scope="col">Cadastro</th>
							<th scope="col">Perfil</th>
							<th scope="col">Cadastrou</th>
							<th scope="col">Cliente</th>
							<th scope="col" class="text-center">Ações</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="usuario : ${usuarios}">
							<th th:text="${usuario.codigoUsuario}" scope="row"></th>
							<td th:text="${usuario.username}"></td>
							<td th:text="${usuario.email}"></td>
							<td th:text="${#dates.format(usuario.dataCadastro, 'dd/MM/yyyy')}"></td>
							<td th:text="${usuario.perfil.nomePerfil}"></td>
							<td th:text="${usuario.usuarioCadastro.username}"></td>
							<td th:text="${usuario.cliente.nomeCliente}"></td>
							<td class="text-center">
								<div class="btn-group" role="group">

									<a th:href="@{/pontolite/usuario/alterar-status?codUsuario={codUsuario}(codUsuario = ${usuario.codigoUsuario})}"
										onclick="loadContentViaFetch(this.href, event)" class="btn btn-sm"
										th:classappend="${usuario.status==1} ? 'btn-outline-success' : 'btn-outline-danger'">
										<i
											th:classappend="${usuario.status==1} ? 'bi bi-check-circle-fill text-success ' : 'bi bi-x-circle-fill text-danger'">
										</i>
									</a>
									<a th:href="@{/pontolite/usuario/alterar?codUsuario={codUsuario}(codUsuario = ${usuario.codigoUsuario})}"
										onclick="loadContentViaFetch(this.href, event)"
										class="btn btn-outline-primary btn-sm" title="Editar">
										<i class="bi bi-pencil"></i>
									</a>
									<!-- Only Admin Octadata can change password here -->
									<a sec:authorize="hasRole('ROLE_ADMIN_OCTADATA')"
										th:href="@{/pontolite/usuario/formulario-alterar-senha(codigoUsuario=${usuario.codigoUsuario})}"
										onclick="loadContentViaFetch(this.href, event)"
										class="btn btn-outline-primary btn-sm" title="Alterar Senha">
										<i class="bi bi-key"></i>
									</a>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>

			<!-- Paginação -->
			<nav th:if="${usuariosPage != null and usuariosPage.totalPages > 1}" aria-label="Navegação de página"
				class="mt-4">
				<ul class="pagination justify-content-center">
					<li class="page-item" th:classappend="${usuariosPage.first} ? 'disabled'">
						<a class="page-link"
							th:href="@{/pontolite/usuario/listar(codCliente=${codCliente}, page=${usuariosPage.number - 1})}"
							onclick="loadContentViaFetch(this.href, event)" tabindex="-1"
							aria-disabled="true">Anterior</a>
					</li>

					<li class="page-item" th:each="i : ${#numbers.sequence(0, usuariosPage.totalPages - 1)}"
						th:classappend="${usuariosPage.number == i} ? 'active'">
						<a class="page-link" th:href="@{/pontolite/usuario/listar(codCliente=${codCliente}, page=${i})}"
							onclick="loadContentViaFetch(this.href, event)" th:text="${i + 1}">1</a>
					</li>

					<li class="page-item" th:classappend="${usuariosPage.last} ? 'disabled'">
						<a class="page-link"
							th:href="@{/pontolite/usuario/listar(codCliente=${codCliente}, page=${usuariosPage.number + 1})}"
							onclick="loadContentViaFetch(this.href, event)">Próxima</a>
					</li>
				</ul>
			</nav>

			<div class="alert alert-warning mt-3 border-0 bg-warning-light" role="alert" id="noResults"
				style="display: none;">
				<i class="bi bi-info-circle me-2"></i> Nenhum usuário encontrado.
			</div>
		</div>
	</div>
</main>

</html>
