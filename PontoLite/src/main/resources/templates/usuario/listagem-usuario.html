<!DOCTYPE html>
<html th:replace="~{aplicacao :: layout(~{:: main})}">

<main>
	<h1>Listagem de Usuários</h1>
	
				    <div class="mb-3">
				        <input type="text" class="form-control" id="searchInput" placeholder="Buscar por nome, e-mail ou telefone...">
				    </div>

				    <div class="table-responsive" style="height: 550px; overflow-y: auto;">
						
				        <table class="table table-striped table-hover" id="clientTable">
				            <thead class="table-warning">
				                <tr>
				                    <th scope="col">#</th>
				                    <th scope="col">Nome</th>
				                    <th scope="col">E-mail</th>
									<th scope="col">Data de Cadastro</th>
									<th scope="col">Perfil</th>
									<th scope="col">Quem Cadastrou</th>
									<th scope="col">Cliente</th>
									<th scope="col">Jornada</th>
									<th scope="col">Status</th>
				                </tr>
				            </thead>
				            <tbody>
				                 <tr th:each="usuario : ${usuarios}">
				                    <th th:text="${usuario.codigoUsuario}" scope="row"></th>
				                    <td th:text="${usuario.username}"></td>
									<td th:text="${usuario.email}"></td>
									<td th:text="${usuario.dataCadastro}"></td>
									<td th:text="${usuario.perfil.nomePerfil}"></td>
									<td th:text="${usuario.usuarioCadastro.username}"></td>
									<td th:text="${usuario.cliente.nomeCliente}"></td>
									<td><button id="bt-status" type="submit" style="width: 65px;" 
									 class="btn btn-success" th:text="Jornada">
									</button></td>
									<td><form action="#" th:action="@{/pontolite/usuario/alterar-status/{codUsuario}(codUsuario = ${usuario.codigoUsuario})}"  method="post">
										<button id="bt-status" 
										        th:text="${usuario.getDescricaoStatus}" 
												type="submit" 
												style="width: 65px;" 
										        class="btn btn-success"
										        th:classappend="${usuario.status==1} ? 'btn btn-success' : 'btn btn-danger'">
									    </button>
									   </form>
									</td>
				                </tr>
				            </tbody>
				        </table>
				    </div>

				    <div class="alert alert-warning mt-3" role="alert" id="noResults" style="display: none;">
				        Nenhum usuário encontrado.
				    </div>
					<button id="default-botao-voltar" class="btn btn-secondary" style="width: 400px; height: 45px;" type="submit">Voltar</button>		
</main>

</html>
