<!DOCTYPE html>
<html th:replace="~{aplicacao :: layout(~{:: main})}">

<main>
	<div class="card">
		<div class="card-header d-flex justify-content-between align-items-center">
			<h5 class="mb-0"><i class="bi bi-person-gear"></i> Alteração de Usuário</h5>
		</div>
		<div class="card-body">
			<form action="#" th:action="@{/pontolite/usuario/alterar}" th:object="${usuario}" method="post"
				onsubmit="submitFormViaFetch(this, event);">
				<input type="hidden" id="input-codigo-usuario" th:field="*{codigoUsuario}">
				<input type="hidden" id="input-data-cadastro" th:field="*{dataCadastro}">
				<input type="hidden" id="input-status" th:field="*{status}">
				<input type="hidden" id="input-password" th:field="*{password}">
				<input type="hidden" id="input-usuario-cadastro" th:field="*{usuarioCadastro}">

				<!-- Section: Dados do Usuário -->
				<h6 class="text-muted mb-3 text-uppercase font-weight-bold"
					style="font-size: 0.8rem; letter-spacing: 1px;">Dados do Usuário</h6>
				<div class="row">
					<div class="col-md-6 mb-3">
						<label for="input-nome-usuario" class="form-label">Nome do Usuário</label>
						<input type="text" class="form-control" id="input-nome-usuario" placeholder="Nome do Usuário"
							required th:field="*{username}" maxlength="60">
						<div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}"
							th:errors="*{username}"></div>
					</div>

					<div class="col-md-6 mb-3">
						<label for="input-email" class="form-label">E-mail</label>
						<input type="email" class="form-control" id="input-email" placeholder="E-mail" required
							th:field="*{email}" maxlength="80">
						<div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
						</div>
					</div>
				</div>

				<hr class="my-4">

				<!-- Section: Configurações de Acesso -->
				<h6 class="text-muted mb-3 text-uppercase font-weight-bold"
					style="font-size: 0.8rem; letter-spacing: 1px;">Configurações de Acesso</h6>
				<div class="row">
					<div class="col-md-4 mb-3">
						<label for="input-nome-perfil" class="form-label">Perfil</label>
						<select class="form-select" id="input-nome-perfil" required th:field="*{perfil}">
							<option value="">Selecione um perfil</option>
							<option th:each="perfil : ${perfis}" th:value="${perfil.codigoPerfil}"
								th:text="${perfil.nomePerfil}">
							</option>
						</select>
						<div class="text-danger small mt-1" th:if="${#fields.hasErrors('perfil')}"
							th:errors="*{perfil}"></div>
					</div>
					<div class="col-md-4 mb-3">
						<label for="input-nome-jornada" class="form-label">Jornada</label>
						<select class="form-select" id="input-nome-jornada" th:field="*{jornada}" disabled>
							<option value="">Selecione uma jornada</option>
							<option th:each="jornada : ${jornadas}" th:value="${jornada.codigoJornada}"
								th:text="${jornada.nomeJornada}">
							</option>
						</select>
						<div class="text-danger small mt-1" th:if="${#fields.hasErrors('jornada')}"
							th:errors="*{jornada}"></div>
					</div>
					<div class="col-md-4 mb-3" sec:authorize="hasRole('ROLE_ADMIN_OCTADATA')">
						<label for="input-nome-cliente" class="form-label">Cliente</label>
						<select class="form-select" id="input-nome-cliente" onchange="carregarJornadaPorCliente()"
							required th:field="*{cliente}">
							<option value="">Selecione um cliente</option>
							<option th:each="cliente : ${clientes}" th:value="${cliente.codigoCliente}"
								th:text="${cliente.nomeCliente}">
							</option>
						</select>
						<div class="text-danger small mt-1" th:if="${#fields.hasErrors('cliente')}"
							th:errors="*{cliente}"></div>
					</div>
				</div>

				<hr class="my-4">

				<!-- Actions -->
				<div class="d-flex justify-content-end gap-2">
					<button class="btn btn-primary" type="submit" id="bt-enviar"><i class="bi bi-save"></i> Salvar
						Alterações</button>
				</div>
			</form>
		</div>
	</div>
	<script th:src="@{/js/usuario/usuario.js}"></script>
</main>

</html>
