<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width" />
<title>Autenticação</title>
<link th:rel="stylesheet" th:href="@{/webjars/bootstrap/4.0.0-2/css/bootstrap.min.css}" />
<link th:rel="stylesheet" th:href="@{/webjars/jquery/3.0.0/jquery.min.js}" />

<body>
	<div id="div-container" class="container-fluid">
		<div id="div-conteudo" align="center" class="col"
			style="margin-top: 100px; margin-left:auto; margin-right: auto;">

			
				<div id="divLoginRowInformacao" class="row justify-content-md-center">
					<span>
						<h1>ACESSO.</h1>
					</span>
				</div>
				<form method="post" th:action="@{/login}" th:object="${loginDto}" >
					<div id="div-login-nome" class="row justify-content-md-center form-group">


						<input th:field="*{username}" th:value="${username}" type="text"
							style="width: 400px; height: 40px" placeholder="Nome do usuário" class="form-control"
							required>
					</div>

					<div id="div-login-senha" class="row justify-content-md-center mt-2 form-group">
						<input th:field="*{password}" th:value="${password}" type="password"
							style="width: 400px; height: 40px" placeholder="Senha" class="form-control" required>
					</div>
					<div id="div-login-botao-submit" class="row justify-content-md-center mt-2 form-group">
						<input type="submit" name="btLoginEnviar" value="Acessar" class="btn btn-success btn-lg"
							style="width: 400px">
					</div>
					
					<hr style="width: 400px">
					
					<div class="alert alert-warning" 
					    role="alert" 
						th:if="${msg}" 
						style="margin-top:10px; width: 300px">
							<div th:text="${msg}"></div>
					</div>

					
				</form>
		</div>
	</div>
	<div>
		<script th:src="@{/webjars/jquery/3.0.0/jquery.min.js}"></script>
		<script th:src="@{/webjars/bootstrap/4.0.0-2/js/bootstrap.min.js}"></script>
	</div>
</body>

</html>
