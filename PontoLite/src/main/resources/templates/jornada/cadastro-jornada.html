<!DOCTYPE html>
<html th:replace="~{aplicacao :: layout(~{:: main})}">

<main>
	<div class="card">
		<div class="card-header">
			<h5 class="mb-0"><i class="bi bi-calendar-week"></i> Cadastro de Jornada</h5>
		</div>
		<div class="card-body">
			<form action="#" th:action="@{/pontolite/jornada/formulario}" th:object="${jornada}" method="post">

				<div class="mb-4">
					<label for="input-nome-jornada" class="form-label">Nome da Jornada</label>
					<input type="text" class="form-control" id="input-nome-jornada"
						placeholder="Ex: Comercial (08:00 - 18:00)" required th:field="*{nomeJornada}" maxlength="60">
					<div class="text-danger small mt-1" th:if="${#fields.hasErrors('nomeJornada')}"
						th:errors="*{nomeJornada}"></div>
				</div>

				<h6 class="text-muted mb-3 text-uppercase font-weight-bold"
					style="font-size: 0.8rem; letter-spacing: 1px;">Quadro de Horários</h6>
				<div class="table-responsive mb-3">
					<table id="table-jornada" class="table table-bordered align-middle">
						<thead class="table-light">
							<tr>
								<th style="width: 15%;">Dia</th>
								<th>Entrada</th>
								<th>Intervalo</th>
								<th>Retorno</th>
								<th>Saída</th>
								<th style="width: 50px;">Ação</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="jornadaDataHora : ${jornada.jornadaDataHora}">
								<td class="fw-bold">Segunda</td>
								<td><input type="time" class="form-control" th:field="{jornadaDataHora.dataJornada}"
										required></td>
								<td><input type="time" class="form-control" th:field="{jornadaDataHora.dataJornada}"
										required></td>
								<td><input type="time" class="form-control" th:field="{jornadaDataHora.dataJornada}"
										required></td>
								<td><input type="time" class="form-control" th:field="{jornadaDataHora.dataJornada}"
										required></td>
								<td class="text-center"><button type="button" class="btn btn-outline-danger btn-sm"><i
											class="bi bi-trash"></i></button></td>
							</tr>
							<!-- Example row since loop might be empty initially -->
							<tr th:if="${jornada.jornadaDataHora == null or jornada.jornadaDataHora.isEmpty()}">
								<td colspan="6" class="text-center text-muted">Nenhum horário definido</td>
							</tr>
						</tbody>
					</table>
				</div>

				<div class="mb-4">
					<button type="button" class="btn btn-outline-primary btn-sm"><i class="bi bi-plus-lg"></i> Adicionar
						Dia</button>
				</div>

				<hr class="my-4">

				<div class="d-flex justify-content-end gap-2">
					<button class="btn btn-primary" type="submit" id="bt-enviar"><i class="bi bi-check-lg"></i> Salvar
						Jornada</button>
				</div>
			</form>
		</div>
	</div>
</main>

</html>
