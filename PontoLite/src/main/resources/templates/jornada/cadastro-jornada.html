<!DOCTYPE html>
<html th:replace="~{aplicacao :: layout(~{:: main})}">

<main>
	<h1>Cadastro de jornada</h1>
	<hr style="margin-top: 20px;">
			<form action="#" th:action="@{/pontolite/jornada/formulario}" th:object="${jornada}" method="post">
				<div class="form-row">
					<div class="col-md-4 mb-3">
						<label for="input-nome-jornada">Nome Jornada</label>
						<input type="text" class="form-control" id="input-nome-jornada" placeholder="Nome Jornada" 
						value="" required th:field="*{nomeJornada}"
						maxlength="60">
						<p th:if="${#fields.hasErrors('nomeJornada')}" th:errors="*{nomeJornada}" class="error"></p>
					</div>
				</div>
				<button class="btn btn-secondary" style="width: 400px; height: 45px;" type="submit" id="bt-enviar">Enviar</button>
				<button id="default-botao-voltar" class="btn btn-secondary" style="width: 400px; height: 45px;" type="submit">Voltar</button>
			</form>
</main>

</html>
