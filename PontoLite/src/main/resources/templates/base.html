<head th:fragment="head">
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>PontoLite - Corporate</title>
	<!-- Bootstrap CSS -->
	<link th:rel="stylesheet" th:href="@{/webjars/bootstrap/4.0.0-2/css/bootstrap.min.css}" />
	<!-- Icons -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

	<!-- Custom Styles -->
	<link th:rel="stylesheet" th:href="@{/css/estilo.css}" />

	<!-- Scripts -->
	<link th:rel="stylesheet" th:href="@{/js/formatacao.js}" />
	<link th:rel="stylesheet" th:href="@{/js/validacao.js}" />
</head>

<div th:fragment="script">
	<!-- JQuery & Bootstrap -->
	<script th:src="@{/webjars/jquery/3.0.0/jquery.min.js}"></script>
	<script th:src="@{/webjars/bootstrap/4.0.0-2/js/bootstrap.min.js}"></script>
	<script th:src="@{/js/formatacao.js}"></script>
	<script th:src="@{/js/validacao.js}"></script>
	<script>
		// Toggle Sidebar Submenus
		$(document).ready(function () {
			$('.has-submenu > .menu-item').click(function () {
				$(this).parent().find('.submenu');/*.slideToggle(5000)*/
				$(this).toggleClass('active');
				$(this).find('.arrow').toggleClass('bi-chevron-right bi-chevron-down');
			});

			// Auto-hide alerts
			setTimeout(function () {
				$(".alert-float").fadeOut(500);
			}, 5000);
		});
	</script>
</div>

<!-- Modern Floating Alert -->
<div th:fragment="mensagem-aplicacao">
	<div th:if="${codeMessage} != null" class="alert-float">
		<div th:if="${codeMessage} == 'SUCCESS'" class="alert alert-success" role="alert"
			style="width: 400px; height: 80px;">
			<i class="bi bi-check-circle-fill me-2"></i> <span th:text="${msgDescription}"></span>
		</div>
		<div th:if="${codeMessage} == 'ERROR'" class="alert alert-danger" role="alert"
			style="width: 400px; height: 80px;">
			<i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${msgDescription}"></span>
		</div>
		<div th:if="${codeMessage} == 'WARNING'" class="alert alert-warning" role="alert"
			style="width: 400px; height: 80px;">
			<i class="bi bi-exclamation-circle-fill me-2"></i> <span th:text="${msgDescription}"></span>
		</div>
		<div th:if="${codeMessage} == 'INFO'" class="alert alert-info" role="alert" style="width: 400px; height: 80px;">
			<i class="bi bi-info-circle-fill me-2"></i> <span th:text="${msgDescription}"></span>
		</div>
	</div>
</div>

<!-- Sidebar -->
<div class="sidebar" th:fragment="menu-principal">
	<div class="sidebar-header">
		<img th:src="@{/images/logo-octadata-001.png}" class="sidebar-logo" alt="PontoLite">
	</div>

	<div class="user-profile">
		<img th:src="@{/images/user-default.jpeg}">
	</div>

	<div class="sidebar-menu">
		<div class="has-submenu">
			<div class="menu-item">
				<span><i class="bi bi-clock-history"></i> Registro de Ponto</span>
				<i class="bi bi-chevron-right arrow"></i>
			</div>
			<div class="submenu">
				<div class="menu-item"><a th:href="@{/pontolite/acessarRegistroPonto}">Registrar</a></div>
				<div class="menu-item"><a th:href="@{/pontolite/ponto/listar}">Meus Pontos</a></div>
			</div>
		</div>

		<div class="has-submenu">
			<div class="menu-item">
				<span><i class="bi bi-building"></i> Clientes</span>
				<i class="bi bi-chevron-right arrow"></i>
			</div>
			<div class="submenu">
				<div class="menu-item"><a th:href="@{/pontolite/cliente/formulario}">Cadastrar</a></div>
				<div class="menu-item"><a th:href="@{/pontolite/cliente/listar}">Listagem</a></div>
			</div>
		</div>

		<div class="has-submenu">
			<div class="menu-item">
				<span><i class="bi bi-people"></i> Usuários</span>
				<i class="bi bi-chevron-right arrow"></i>
			</div>
			<div class="submenu">
				<div class="menu-item"><a th:href="@{/pontolite/usuario/formulario}">Cadastrar</a></div>
				<div class="menu-item"><a th:href="@{/pontolite/usuario/listar}">Listagem</a></div>
			</div>
		</div>

		<div class="has-submenu">
			<div class="menu-item">
				<span><i class="bi bi-calendar-range"></i> Jornada</span>
				<i class="bi bi-chevron-right arrow"></i>
			</div>
			<div class="submenu">
				<div class="menu-item"><a th:href="@{/pontolite/jornada/formulario}">Cadastrar</a></div>
				<div class="menu-item"><a th:href="@{/pontolite/jornada/listar}">Listagem</a></div>
			</div>
		</div>

		<div class="has-submenu">
			<div class="menu-item">
				<span><i class="bi bi-person-lock"></i> Perfil de Acesso</span>
				<i class="bi bi-chevron-right arrow"></i>
			</div>
			<div class="submenu">
				<div class="menu-item"><a th:href="@{/pontolite/perfilAcesso/formulario}">Gerenciar</a></div>
			</div>
		</div>

		<div class="menu-item"><span><i class="bi bi-gear"></i> Configurações</span></div>
	</div>
</div>
