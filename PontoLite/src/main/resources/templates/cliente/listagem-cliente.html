<!DOCTYPE html>
<html th:replace="~{aplicacao :: layout(~{:: main})}">

<main>
	<div class="card">
		<div class="card-header d-flex justify-content-between align-items-center">
			<span>Listagem de Clientes</span>
		</div>
		<div class="card-body">
			<!-- Search Bar -->
			<div class="mb-4">
				<div class="input-group">
					<span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
					<input type="text" class="form-control" id="searchInput" th:value="${nomeCliente}"
						placeholder="Buscar por nome">

					<button class="btn btn-outline-primary btn-sm" title="Pesquisar"
						th:onclick="|pesquisarFormulario('@{/pontolite/cliente/listar-por-nome(nomeCliente=parametro1)}', event)|"
						style="margin-left: 18px;">
						<i class="bi bi-search"></i> Pesquisar
					</button>
				</div>

			</div>

			<!-- Table -->
			<div class="table-responsive">
				<table id="clientTable" class="align-middle table table-hover default-table-font-size">
					<thead>
						<tr>
							<th scope="col">#</th>
							<th scope="col">Razão Social</th>
							<th scope="col">Nome Fantasia</th>
							<th scope="col">Cadastro</th>
							<th scope="col">CNPJ</th>
							<th scope="col">E-mail</th>
							<th scope="col">Telefone</th>
							<th scope="col" class="text-center">Ações</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="cliente : ${clientes}">
							<th th:text="${cliente.codigoCliente}" scope="row"></th>
							<td th:text="${cliente.razaoSocial}"></td>
							<td th:text="${cliente.nomeCliente}"></td>
							<td th:text="${#dates.format(cliente.dataCadastro, 'dd/MM/yyyy')}"></td>
							<td th:text="${cliente.numeroCnpj}"></td>
							<td th:text="${cliente.nomeEmail}"></td>
							<td th:text="${cliente.numeroTelefone}"></td>
							<td class="text-center">
								<div class="btn-group" role="group">
									<a href="#"
										th:onclick="|apiAtualizaStatus('@{/pontolite/cliente/alterar-status(codCliente=${cliente.codigoCliente})}', event)|"
										class="btn btn-outline-info btn-sm" title="Status">
										<i
											th:classappend="${cliente.situacaoCliente==1} ? 'bi bi-check-circle-fill text-success ' : 'bi bi-x-circle-fill text-danger'">
										</i>
									</a>
									<a href="#"
										th:onclick="|loadContentViaFetch('@{/pontolite/cliente/alterar(codCliente=${cliente.codigoCliente})}', event)|"
										class="btn btn-outline-primary btn-sm" title="Editar">
										<i class="bi bi-pencil"></i>
									</a>
									<a href="#"
										th:onclick="|pesquisarFormulario('@{/pontolite/usuario/listar-por-nome(nomeUsuario=parametro1,codCliente=${cliente.codigoCliente})}', event)|"
										class="btn btn-outline-info btn-sm" title="Usuários">
										<i class="bi bi-people"></i>
									</a>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>

			<!-- Paginação -->
			<nav th:if="${clientesPage != null and clientesPage.totalPages > 1}" aria-label="Navegação de página"
				class="mt-4">
				<ul class="pagination justify-content-center">
					<li class="page-item" th:classappend="${clientesPage.first} ? 'disabled'">
						<a class="page-link" href="#"
							th:onclick="|pesquisarFormulario('@{/pontolite/cliente/listar-por-nome(nomeCliente=parametro1, page=${clientesPage.number - 1})}', event)|"
							tabindex="-1" aria-disabled="true">Anterior</a>
					</li>

					<li class="page-item" th:each="i : ${#numbers.sequence(0, clientesPage.totalPages - 1)}"
						th:classappend="${clientesPage.number == i} ? 'active'">
						<a class="page-link" href="#"
							th:onclick="|pesquisarFormulario('@{/pontolite/cliente/listar-por-nome(nomeCliente=parametro1, page=${i})}', event)|"
							th:text="${i + 1}">1</a>
					</li>

					<li class="page-item" th:classappend="${clientesPage.last} ? 'disabled'">
						<a class="page-link" href="#"
							th:onclick="|pesquisarFormulario('@{/pontolite/cliente/listar-por-nome(nomeCliente=parametro1, page=${clientesPage.number + 1})}', event)|">Próxima</a>
					</li>
				</ul>
			</nav>

			<div class="alert alert-warning mt-3 border-0 bg-warning-light" role="alert" id="noResults"
				style="display: none;">
				<i class="bi bi-info-circle me-2"></i> Nenhum cliente encontrado.
			</div>
		</div>
	</div>
</main>

</html>
