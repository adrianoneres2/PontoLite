<!DOCTYPE html>
<html th:fragment="layout(conteudo)" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{base :: head}"></head>

<body>
	<div class="layout-wrapper">
		<!-- Sidebar from Base Fragment -->
		<div th:replace="~{base :: menu-principal}"></div>

		<!-- Main Content Area -->
		<div class="main-content">
			<!-- Header / Topbar (Simplified) -->
			<div class="page-header d-flex justify-content-between align-items-center">
				<div>
					<h1 th:text="'Bem-vindo, ' + ${session.usuarioLogado.username}"
						style="font-size: 20px; font-weight: normal; color: #666;">Bem-vindo</h1>
					<small class="text-muted" th:text="${session.usuarioLogado.perfil.nomePerfil}"></small>
				</div>
				<div class="d-flex gap-2">
					<a th:href="@{/pontolite}" class="btn btn-outline-primary btn-sm"><i class="bi bi-house"></i>
						Home</a>
					<div style="width: 10px;"></div>
					<a th:href="@{/login/logof}" class="btn btn-outline-danger btn-sm"><i
							class="bi bi-box-arrow-right"></i> Sair</a>
				</div>
			</div>

			<!-- Dynamic Content Injection -->
			<div style="margin-top: 20px;">
				<main th:replace="${conteudo}"></main>
			</div>

			<!-- Floating Messages -->
			<div th:replace="~{base :: mensagem-aplicacao}"></div>
		</div>
	</div>

	<!-- Scripts Fragment -->
	<div th:replace="~{base :: script}"></div>
</body>

</html>
